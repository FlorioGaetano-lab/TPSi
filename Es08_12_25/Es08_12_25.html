<!DOCTYPE html>
<html>
<head>
  <title>Grafico femminicidi con Canvas</title>
</head>
<body>

<canvas id="grafico" width="650" height="300" style="border:1px solid black;" ></canvas>

<script>
const coordinate = [
  
];

const canvas = document.getElementById("grafico");
const ctxx = canvas.getContext("2d");
const ctxy = canvas.getContext("2d");
const ctx1 = canvas.getContext("2d");
  
ctxx.beginPath();
ctxx.moveTo(0,250);
ctxx.lineTo(600,250);
ctxx.stroke();

ctxy.beginPath();
ctxy.moveTo(20,0);
ctxy.lineTo(20,300);
ctxy.stroke();
  
ctx1.beginPath();


ctx1.moveTo(coordinate[0].x, coordinate[0].y);


for (let i = 1; i < coordinate.length; i++) {
  ctx1.lineTo(coordinate[i].x, coordinate[i].y);
}


ctx1.stroke();
</script>

</body>
</html>
