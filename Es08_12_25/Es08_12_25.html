<!DOCTYPE html>
<html>
<head>
  <title>Grafico femminicidi con Canvas</title>
</head>
<body>

<canvas id="grafico" width="600" height="300" style="border:1px solid black;" ></canvas>

<script>
const coordinate = [
  {x:0,y:220},
  {x:50,y:180},
  {x:100,y:200},
  {x:150,y:200},
  {x:200,y:220},
  {x:250,y:260},
  {x:300,y:280},
  {x:350,y:260},
  {x:400,y:180},
  {x:450,y:200},
  {x:500,y:260},
  {x:550,y:260}
];

const canvas = document.getElementById("grafico");
const ctxx = canvas.getContext("2d");
const ctxy = canvas.getContext("2d");
const ctx = canvas.getContext("2d");
  
ctxx.beginPath();
ctxx.moveTo(0,290);
ctxx.lineTo(600,290);
ctxx.stroke();
  
ctxy.beginPath();
ctxy.moveTo(20,0);
ctxy.lineTo(20,300);
ctxy.stroke();
  
ctx.beginPath();


ctx.moveTo(coordinate[0].x, coordinate[0].y);


for (let i = 1; i < coordinate.length; i++) {
  ctx.lineTo(coordinate[i].x, coordinate[i].y);
}


ctx.stroke();
</script>

</body>
</html>
