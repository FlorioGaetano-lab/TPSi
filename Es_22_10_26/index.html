<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Dati COVID-19</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="contenitore">
        <h2>Andamento Nazionale COVID-19</h2>
        
        <p class="sottotitolo" id="testo-sottotitolo">Visualizzazione degli ultimi 10 giorni registrati</p>
    
        <div style="margin-bottom: 20px;">
            <label for="input-giorni">Quanti giorni vuoi vedere? </label>
            <input type="number" id="input-giorni" value="10" min="1" style="padding: 5px; width: 60px;">
            <button id="btn-aggiorna" style="padding: 6px 12px; cursor: pointer;">Aggiorna Tabella</button>
        </div>
        
        <div class="tabella-wrapper">
            <table id="tabella-covid">

            </table>
        </div>
    </div>
  
    <script src="script.js" defer></script>
</body>
</html>
