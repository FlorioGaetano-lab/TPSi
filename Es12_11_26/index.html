<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertitore Valute BCE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Convertitore da Euro (€)</h2>
    
    <label for="importo">Quantità in Euro:</label>
    <input type="number" id="importo" placeholder="Es. 100" min="0" step="0.01">

    <label for="valuta">Scegli la valuta di destinazione:</label>
    <select id="valuta">
        <option value="">Caricamento valute in corso...</option>
    </select>

    <button onclick="calcolaConversione()">Converti</button>

    <div id="risultato"></div>
</div>

<script src="script.js"></script>
</body>
</html>
